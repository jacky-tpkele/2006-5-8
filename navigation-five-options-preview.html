<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TPKELE | 5 Navigation Options</title>
  <style>
    :root{--ink:#17231e;--muted:#64716a;--line:#dce6df;--green:#087d3b;--green-deep:#075b2e;--green-pale:#eaf5ed;--paper:#f2f5f3;--white:#fff;--orange:#b56720}
    *{box-sizing:border-box}html{font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink);letter-spacing:0}body{margin:0;background:var(--paper)}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}a:hover{color:var(--green)}
    .showcase{max-width:1380px;margin:auto;padding:28px 24px 80px}.showcase-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.showcase-top h1{font-size:23px;line-height:1.3;margin:0}.showcase-top p{font-size:13px;color:var(--muted);margin:7px 0 0}.switches{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.device-switch,.option-switch{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700}.device-switch{height:35px;padding:0 13px;border-radius:5px;font-size:12px}.device-switch.active,.option-switch.active{background:var(--ink);color:#fff;border-color:var(--ink)}.option-bar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}.option-switch{white-space:nowrap;text-align:left;border-radius:6px;padding:12px 16px;min-width:155px}.option-switch b{display:block;font-size:13px}.option-switch small{display:block;font-size:11px;font-weight:400;margin-top:4px;opacity:.8}.preview-label{font-size:12px;color:var(--muted);margin:0 0 12px}.preview-label strong{color:var(--ink)}
    .stage{border:1px solid #d4dfd7;background:#e7eee9;min-height:635px;padding:28px;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}.preview{background:#fff;width:100%;max-width:1260px;min-height:530px;box-shadow:0 18px 42px #16271c18;overflow:hidden}.preview.mobile{width:390px;max-width:100%;min-height:570px}.preview.mobile .desktop-only{display:none!important}.preview:not(.mobile) .mobile-only{display:none!important}.brand{font-size:25px;color:var(--green);font-weight:900;white-space:nowrap}.nav-link{font-size:12px;font-weight:700;white-space:nowrap}.nav-link.current{color:var(--green)}.nav-links{display:flex;align-items:center;gap:20px}.nav-actions{display:flex;align-items:center;gap:10px}.quote{background:var(--green);border:1px solid var(--green);color:#fff;font-size:12px;font-weight:700;padding:11px 14px;border-radius:4px;white-space:nowrap}.quote:hover{background:var(--green-deep);color:#fff}.icon-btn{border:0;background:transparent;color:var(--ink);font-size:20px;width:34px;height:34px;display:grid;place-items:center}.plain-btn{border:0;background:transparent;color:var(--ink);font-size:12px;font-weight:700;padding:8px 0}.chev{font-size:10px;color:var(--green);margin-left:5px}.preview-header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 28px;height:72px;border-bottom:1px solid var(--line)}.preview.mobile .preview-header{height:64px;padding:0 18px}.preview.mobile .brand{font-size:23px}.mobile-trigger{border:1px solid var(--line);border-radius:4px;background:#fff;padding:7px 10px;font-size:18px;line-height:1}.panel-title{font-size:11px;text-transform:uppercase;font-weight:800;color:var(--muted);margin:0 0 14px}.cat-name{font-weight:800;font-size:15px}.cat-children{display:flex;flex-direction:column;gap:8px;margin-top:11px}.cat-children a{font-size:12px;color:#4a5c50}.cat-children a:hover{color:var(--green)}.all-link{font-size:12px;font-weight:800;color:var(--green)}.minor{font-size:11px;color:var(--muted)}.mobile-list{padding:10px 18px 24px}.mobile-list details{border-bottom:1px solid var(--line)}.mobile-list summary{font-size:14px;font-weight:800;list-style:none;cursor:pointer;padding:15px 0;display:flex;justify-content:space-between}.mobile-list summary::-webkit-details-marker{display:none}.mobile-list summary:after{content:'+';color:var(--green);font-size:18px}.mobile-list details[open] summary:after{content:'−'}.mobile-list .cat-children{padding:0 0 17px 12px;gap:12px}.mobile-list .cat-children a{font-size:13px}.mobile-list .quote{display:block;text-align:center;margin-top:20px}
    /* Option 1: taxonomy mega menu */
    .v1-panel{display:grid;grid-template-columns:1.05fr 1.05fr 1fr 1fr;min-height:450px}.v1-col{padding:27px 26px;border-right:1px solid var(--line)}.v1-col:last-child{border-right:0}.v1-section{margin-bottom:26px}.v1-col:first-child{background:#f0f8f1}.v1-col .cat-name{display:flex;justify-content:space-between}.v1-col .cat-name:after{content:'↗';color:var(--green);font-size:13px}.v1-footer{border-top:1px solid var(--line);padding:15px 28px;display:flex;gap:26px;font-size:12px;font-weight:700}.v1-footer a:last-child{color:var(--green)}
    /* Option 2: category rail */
    .v2-panel{display:grid;grid-template-columns:235px minmax(0,1fr) 255px;min-height:452px}.v2-rail{background:#f5f8f5;border-right:1px solid var(--line);padding:22px 0}.v2-rail .panel-title{padding:0 20px}.v2-cat{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-left:3px solid transparent;background:none;text-align:left;padding:13px 20px;font-weight:700;font-size:13px}.v2-cat.active{border-color:var(--green);color:var(--green);background:#fff}.v2-cat span:last-child{font-size:16px}.v2-main{padding:34px}.v2-main h2,.v4-panel h2{font-size:24px;margin:0 0 7px}.v2-main p,.v4-panel p{font-size:13px;color:var(--muted);margin:0 0 24px}.v2-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.v2-links a{border:1px solid var(--line);border-radius:4px;padding:16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}.v2-links a:hover{border-color:var(--green);background:var(--green-pale)}.v2-aside{border-left:1px solid var(--line);background:#fcfdfb;padding:22px}.v2-aside img{width:100%;height:180px;object-fit:contain}.v2-aside b{font-size:15px;display:block;margin:10px 0}.v2-aside p{font-size:12px;line-height:1.55;color:var(--muted)}
    /* Option 3: visual catalog */
    .v3-toolbar{padding:18px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.v3-toolbar strong{font-size:15px}.v3-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}.v3-card{padding:16px 18px 19px;min-height:212px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.v3-card:nth-child(4n){border-right:0}.v3-card img{height:89px;width:100%;object-fit:contain}.v3-card h3{font-size:13px;margin:7px 0 4px}.v3-card .minor{display:block;line-height:1.3}.v3-card .all-link{display:inline-block;margin-top:9px}.v3-card:hover{background:#f5faf6}.v3-spot{padding:24px;background:#e7f3e9;display:flex;flex-direction:column;justify-content:center}.v3-spot strong{font-size:19px;line-height:1.25}.v3-spot p{font-size:12px;line-height:1.5;color:#45624e}
    .v3-child-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.v3-child-links a{font-size:10px;color:var(--green);border:1px solid #cfe3d3;padding:4px 6px;border-radius:3px}.v3-child-links a:hover{background:var(--green-pale)}
    /* Option 4: two-tier category strip */
    .v4-strip{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:0 19px;background:#f2f7f3;border-bottom:1px solid var(--line);overflow-x:auto}.v4-tab{flex:1;min-width:max-content;text-align:center;border:0;border-bottom:3px solid transparent;background:transparent;padding:16px 8px 13px;font-size:12px;font-weight:800}.v4-tab.active{color:var(--green);border-bottom-color:var(--green);background:#fff}.v4-panel{padding:34px 38px;min-height:345px;display:grid;grid-template-columns:1fr 260px;gap:28px}.v4-links{display:flex;flex-wrap:wrap;gap:10px}.v4-links a{min-width:160px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;padding:11px 4px;display:flex;justify-content:space-between}.v4-links a:after{content:'→';color:var(--green)}.v4-visual{border-left:1px solid var(--line);padding-left:28px;display:flex;align-items:center;justify-content:center}.v4-visual img{height:230px;width:100%;object-fit:contain}
    /* Option 5: search-first directory */
    .v5-header{background:#163c2a;color:#fff;border-color:#345344}.v5-header .brand{color:#fff}.v5-header .nav-link,.v5-header .icon-btn{color:#fff}.v5-header .quote{background:#fff;color:#163c2a;border-color:#fff}.v5-panel{padding:25px 30px 32px;min-height:454px}.v5-search{display:flex;gap:10px;align-items:center;background:#f4f7f4;border:1px solid #cfdcd2;border-radius:5px;padding:0 16px;max-width:740px;height:48px}.v5-search span{font-size:20px;color:var(--green)}.v5-search input{background:none;border:0;outline:0;flex:1;min-width:0;font-size:13px}.v5-search input::placeholder{color:#839087}.v5-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 13px}.v5-head strong{font-size:14px}.v5-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.v5-cat{border:1px solid var(--line);border-radius:5px;padding:14px;min-height:105px}.v5-cat:hover{border-color:var(--green);background:#f4faf5}.v5-cat strong{display:block;font-size:13px}.v5-cat .minor{display:block;margin:6px 0 12px}.v5-results{display:flex;gap:9px;flex-wrap:wrap}.v5-results a{border:1px solid var(--line);background:#f8faf8;font-size:12px;font-weight:700;border-radius:4px;padding:10px 12px}.v5-results a:hover{background:var(--green-pale);border-color:var(--green)}.v5-empty{font-size:13px;color:var(--muted)}
    .preview.mobile .v1-panel,.preview.mobile .v2-panel,.preview.mobile .v3-grid,.preview.mobile .v4-panel,.preview.mobile .v5-grid{display:block}.preview.mobile .v1-col{border-right:0;border-bottom:1px solid var(--line);padding:18px}.preview.mobile .v1-col .v1-section{margin-bottom:18px}.preview.mobile .v1-footer{display:block;padding:18px}.preview.mobile .v1-footer a{display:block;padding:8px 0}.preview.mobile .v2-rail{padding:0;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto}.preview.mobile .v2-rail .panel-title{display:none}.preview.mobile .v2-cat{min-width:max-content;width:auto;border-left:0;border-bottom:3px solid transparent;padding:14px}.preview.mobile .v2-cat.active{border-bottom-color:var(--green)}.preview.mobile .v2-cat span:last-child{display:none}.preview.mobile .v2-main{padding:22px}.preview.mobile .v2-main h2{font-size:20px}.preview.mobile .v2-links{grid-template-columns:1fr}.preview.mobile .v2-aside{display:none}.preview.mobile .v3-toolbar{padding:15px 18px}.preview.mobile .v3-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.preview.mobile .v3-card{min-height:190px;padding:12px;border-right:1px solid var(--line)}.preview.mobile .v3-card:nth-child(2n){border-right:0}.preview.mobile .v3-card img{height:75px}.preview.mobile .v3-spot{min-height:190px;padding:14px}.preview.mobile .v3-spot strong{font-size:15px}.preview.mobile .v4-strip{padding:0 8px}.preview.mobile .v4-tab{padding:13px 11px;font-size:11px}.preview.mobile .v4-panel{padding:22px;min-height:370px}.preview.mobile .v4-panel h2{font-size:20px}.preview.mobile .v4-visual{display:none}.preview.mobile .v4-links a{width:100%}.preview.mobile .v5-panel{padding:18px}.preview.mobile .v5-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.preview.mobile .v5-cat{min-height:88px}.preview.mobile .v5-head{margin-top:20px}.preview.mobile .v5-header .brand{font-size:23px}
    @media(max-width:760px){.showcase{padding:18px 12px 45px}.showcase-top{display:block}.switches{margin-top:14px}.option-switch{min-width:145px;padding:10px 12px}.stage{padding:12px;min-height:600px}.preview:not(.mobile){min-width:930px}.stage:has(.preview:not(.mobile)){overflow-x:auto;justify-content:flex-start}.preview-header{padding:0 18px}.nav-links{gap:11px}.nav-link{font-size:11px}}
  </style>
</head>
<body>
  <main class="showcase">
    <div class="showcase-top"><div><h1>TPKELE 产品导航 · 5 个版式</h1><p>独立导航预览。产品分类和链接沿用当前网站，点击产品链接会在新窗口打开现有页面。</p></div><div class="switches"><button class="device-switch active" data-device="desktop" type="button">桌面预览</button><button class="device-switch" data-device="mobile" type="button">手机预览</button></div></div>
    <div class="option-bar" role="tablist" aria-label="选择导航方案">
      <button class="option-switch active" data-option="1" role="tab" aria-selected="true" type="button"><b>01 全分类大菜单</b><small>一次看到全部系列</small></button>
      <button class="option-switch" data-option="2" role="tab" aria-selected="false" type="button"><b>02 左侧目录钻取</b><small>分类切换清楚</small></button>
      <button class="option-switch" data-option="3" role="tab" aria-selected="false" type="button"><b>03 图片产品目录</b><small>产品识别优先</small></button>
      <button class="option-switch" data-option="4" role="tab" aria-selected="false" type="button"><b>04 双层横向导航</b><small>类别始终可见</small></button>
      <button class="option-switch" data-option="5" role="tab" aria-selected="false" type="button"><b>05 搜索式目录</b><small>型号查找优先</small></button>
    </div>
    <p class="preview-label" id="previewLabel"><strong>01 全分类大菜单</strong> · 桌面预览</p>
    <div class="stage"><div id="preview" class="preview" aria-live="polite"></div></div>
  </main>
  <script>
    const base='https://www.tpkele.com';
    const families=[
      {name:'MCB',href:'/products/category/mcb',hint:'AC / DC / Smart',image:'public/assets/home-products-normalized/mcb.webp',children:[['AC MCB','/products/category/mcb/ac-mcb'],['DC MCB','/products/category/mcb/dc-mcb'],['Smart Wi-Fi MCB','/products/smart-circuit-breaker']]},
      {name:'RCBO',href:'/products/category/rcbo',hint:'Residual current protection',image:'public/assets/products/rcbo-1pn-18mm/rcbo-1pn-18mm-front.webp',children:[['1P+N 18mm RCBO','/products/1pn-rcbo'],['Australia & NZ RCBO','/products/rcbo-australia-new-zealand']]},
      {name:'SPD',href:'/products/category/spd',hint:'AC / Solar DC',image:'public/assets/home-products-normalized/spd.webp',children:[['AC SPD','/products/category/spd/ac-spd'],['DC SPD','/products/category/spd/dc-spd']]},
      {name:'ATS',href:'/products/category/ats',hint:'Automatic transfer switches',image:'public/assets/home-products-normalized/ats.webp',children:[['ATS-ST','/products/category/ats?series=ATS-ST%20Series'],['ATS-W2R','/products/category/ats?series=ATS-W2R%20Series'],['STQ1','/products/category/ats?series=STQ1%20Series'],['STQ2','/products/category/ats?series=STQ2%20Series']]},
      {name:'PV Combiner Box',href:'/products/category/combiner-box',hint:'Plastic / Metal enclosures',image:'public/assets/home-products-normalized/combiner-box.webp',children:[['Plastic Box Series','/products/category/combiner-box?series=Plastic%20Box%20Series'],['Metal Box Series','/products/category/combiner-box?series=Metal%20Box%20Series']]},
      {name:'Voltage Protector',href:'/products/category/voltage-protector',hint:'Over / under voltage',image:'public/assets/home-products-normalized/over-voltage-protector.webp',children:[['Browse Voltage Protectors','/products/category/voltage-protector']]},
      {name:'Energy Meter',href:'/products/category/energy-meter',hint:'DIN rail metering',image:'public/assets/home-products-normalized/din-rail-energy-meter.webp',children:[['Browse Energy Meters','/products/category/energy-meter']]}
    ];
    const link=(label,href,cls='')=>`<a class="${cls}" href="${base+href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    const children=f=>`<div class="cat-children">${f.children.map(([name,href])=>link(name,href)).join('')}</div>`;
    const otherLinks=`${link('Home','/','nav-link')}${link('Products','/products','nav-link current')}${link('Manufacturing','/mcb-manufacturer','nav-link')}${link('Resources','/resources','nav-link')}${link('Projects','/projects','nav-link')}${link('About','/about','nav-link')}${link('Contact','/contact','nav-link')}`;
    function header(kind='') {return `<header class="preview-header ${kind}"><a class="brand" href="${base}" target="_blank" rel="noopener noreferrer">TPKELE</a><nav class="nav-links desktop-only">${otherLinks}</nav><div class="nav-actions"><button type="button" class="icon-btn desktop-only" title="Search products" aria-label="Search products">⌕</button>${link('Get a Quote','/contact','quote desktop-only')}<button type="button" class="mobile-trigger mobile-only" title="Open menu" aria-label="Open menu">☰</button></div></header>`}
    function mobileAccordion(){return `<nav class="mobile-list"><p class="panel-title">PRODUCT CATEGORIES</p>${families.map(f=>`<details><summary>${f.name}</summary><div class="cat-children">${link('View all '+f.name,f.href,'all-link')}${f.children.map(([n,u])=>link(n,u)).join('')}</div></details>`).join('')}${link('All Products','/products','all-link')}${link('Get a Quote','/contact','quote')}</nav>`}
    function v1(mobile){const groups=[[families[0],families[1]],[families[2],families[3]],[families[4]],[families[5],families[6]]];return header()+ (mobile?mobileAccordion():`<nav class="v1-panel">${groups.map((group,i)=>`<div class="v1-col"><p class="panel-title">${['CIRCUIT PROTECTION','SURGE & TRANSFER','SOLAR ASSEMBLIES','MONITORING'][i]}</p>${group.map(f=>`<div class="v1-section">${link(f.name,f.href,'cat-name')}${children(f)}</div>`).join('')}</div>`).join('')}</nav><div class="v1-footer">${link('Browse all products →','/products')}${link('Technical guides →','/resources/technical-guides')}${link('Market access & certification →','/resources/market-access-advisor')}</div>`)}
    function v2(mobile,selected=0){const f=families[selected];return header()+`<nav class="v2-panel"><div class="v2-rail"><p class="panel-title">PRODUCT FAMILIES</p>${families.map((x,i)=>`<button type="button" class="v2-cat ${i===selected?'active':''}" data-family="${i}"><span>${x.name}</span><span>›</span></button>`).join('')}</div><div class="v2-main"><p class="panel-title">PRODUCT RANGE</p><h2>${f.name}</h2><p>${f.hint}</p><div class="v2-links">${f.children.map(([n,u])=>link(`${n}<span>→</span>`,u)).join('')}${link(`All ${f.name} <span>→</span>`,f.href)}</div></div><aside class="v2-aside"><img src="${f.image}" alt=""><b>${f.name}</b><p>${f.hint}</p>${link('Explore category →',f.href,'all-link')}</aside></nav>`}
    function v3(mobile){return header()+`<div class="v3-toolbar"><strong>Browse by product family</strong>${link('View all products →','/products','all-link')}</div><nav class="v3-grid">${families.map(f=>`<div class="v3-card">${link(`<img src="${f.image}" alt="${f.name}"><h3>${f.name}</h3>`,f.href)}<span class="minor">${f.hint}</span><div class="v3-child-links">${f.children.slice(0,3).map(([n,u])=>link(n,u)).join('')}</div></div>`).join('')}<div class="v3-spot"><strong>Smart Wi-Fi MCB</strong><p>Remote control and monitoring series</p>${link('Explore Smart Series →','/products/smart-circuit-breaker','all-link')}</div></nav>`}
    function v4(mobile,selected=0){const f=families[selected];return header()+`<nav class="v4-strip">${families.map((x,i)=>`<button type="button" class="v4-tab ${i===selected?'active':''}" data-family="${i}">${x.name}</button>`).join('')}</nav><div class="v4-panel"><div><p class="panel-title">${f.name.toUpperCase()} PRODUCT RANGE</p><h2>${f.name}</h2><p>${f.hint}</p><div class="v4-links">${f.children.map(([n,u])=>link(n,u)).join('')}${link('View all '+f.name,f.href)}</div></div><div class="v4-visual"><img src="${f.image}" alt="${f.name}"></div></div>`}
    function v5(mobile,query=''){const q=query.trim().toLowerCase();const matches=families.flatMap(f=>[[f.name,f.href],...f.children]).filter(([n])=>n.toLowerCase().includes(q)).slice(0,12);return header('v5-header')+`<nav class="v5-panel"><label class="v5-search"><span aria-hidden="true">⌕</span><input id="finder" type="search" value="${query.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" placeholder="Search MCB, SPD, ATS, voltage protector..."></label><div class="v5-head"><strong>${q?'Matching products':'Product categories'}</strong>${link('All products →','/products','all-link')}</div>${q?`<div class="v5-results">${matches.length?matches.map(([n,u])=>link(n+' →',u)).join(''):'<span class="v5-empty">No matching product in this catalog.</span>'}</div>`:`<div class="v5-grid">${families.map(f=>link(`<strong>${f.name}</strong><span class="minor">${f.hint}</span><span class="all-link">Explore →</span>`,f.href,'v5-cat')).join('')}</div><div class="v5-head"><strong>Popular product lines</strong></div><div class="v5-results">${[['DC MCB','/products/category/mcb/dc-mcb'],['AC MCB','/products/category/mcb/ac-mcb'],['DC SPD','/products/category/spd/dc-spd'],['RCBO','/products/category/rcbo'],['PV Combiner Box','/products/category/combiner-box']].map(([n,u])=>link(n+' →',u)).join('')}</div>`}</nav>`}
    const names=['全分类大菜单','左侧目录钻取','图片产品目录','双层横向导航','搜索式目录'];
    const state={option:1,device:'desktop',family:0,query:''};
    function render(){const mobile=state.device==='mobile';const preview=document.getElementById('preview');preview.className='preview'+(mobile?' mobile':'');preview.innerHTML=[v1,v2,v3,v4,v5][state.option-1](mobile,state.option===5?state.query:state.family);document.getElementById('previewLabel').innerHTML=`<strong>0${state.option} ${names[state.option-1]}</strong> · ${mobile?'手机':'桌面'}预览`;preview.querySelectorAll('[data-family]').forEach(btn=>btn.addEventListener('click',()=>{state.family=Number(btn.dataset.family);render()}));const finder=preview.querySelector('#finder');if(finder)finder.addEventListener('input',()=>{state.query=finder.value;const pos=finder.selectionStart;render();const next=preview.querySelector('#finder');next.focus();next.setSelectionRange(pos,pos)})}
    document.querySelectorAll('[data-option]').forEach(btn=>btn.addEventListener('click',()=>{state.option=Number(btn.dataset.option);state.family=0;state.query='';document.querySelectorAll('[data-option]').forEach(x=>{x.classList.toggle('active',x===btn);x.setAttribute('aria-selected',String(x===btn))});render()}));
    document.querySelectorAll('[data-device]').forEach(btn=>btn.addEventListener('click',()=>{state.device=btn.dataset.device;document.querySelectorAll('[data-device]').forEach(x=>x.classList.toggle('active',x===btn));render()}));
    render();
  </script>
</body>
</html>
